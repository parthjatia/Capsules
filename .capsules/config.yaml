format: 0.1
agents: [claude-code]
ignore:
  - ".capsules/**"
  - ".claude/**"
  - ".cursor/**"
  - ".github/**"
  - "README.md"
  - "CHANGELOG.md"
  - "CLAUDE.md"
  - "LICENSE"
  - "docs/**"
  - "**/package-lock.json"
  - ".gitignore"
  - ".gitattributes"
  - ".prettierrc.json"
  - ".prettierignore"
checks:
  files:
    - "test/**"
    - "**/*.test.*"
  timeout-seconds: 300
one-rule:
  new-checks-with-code: allow
weakened-tests: warn
stale-links: warn
ci:
  mode: report
hooks:
  on-error: open
rules:
  max-chars: 6000
build:
  command: "npm run build"
  test: "npm test"
  outputs: ["dist/**"]
