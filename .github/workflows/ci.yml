name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Decide which machines to test on (D-009). macOS minutes cost 10x on a private repo,
  # so macOS runs only for pull requests into main and pushes to main.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          REF: ${{ github.ref }}
        run: |
          mac=""
          if [ "$BASE" = "main" ] || { [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; }; then
            mac=',{"os":"macos-latest","node":22}'
          fi
          echo "matrix={\"include\":[{\"os\":\"ubuntu-latest\",\"node\":22},{\"os\":\"ubuntu-latest\",\"node\":24},{\"os\":\"windows-latest\",\"node\":22}${mac}]}" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # capsules check compares against the pull request's base (C6.4)
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run spec:check
      - run: npm test
      - name: dogfood (guard this repo's own changes with its .capsules/)
        run: node dist/cli.js check --no-run
      - name: demo app tests (must pass unchanged)
        working-directory: examples/billing-demo
        run: npm test
      - name: demo capsules and lockfile are valid and up to date
        working-directory: examples/billing-demo
        # --base HEAD: the demo is test data, so validate it without guarding this PR's history.
        run: node ../../dist/cli.js check --no-run --base HEAD
      - name: npx . --version
        shell: bash
        run: |
          out="$(npx --yes . --version)"
          echo "capsules --version -> $out"
          test "$out" = "$(node -p "require('./package.json').version")"
