name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Decide which machines to test on (D-009). macOS minutes cost 10x on a private repo,
  # so macOS runs only for pull requests into main and pushes to main.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          REF: ${{ github.ref }}
        run: |
          mac=""
          if [ "$BASE" = "main" ] || { [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; }; then
            mac=',{"os":"macos-latest","node":22}'
          fi
          echo "matrix={\"include\":[{\"os\":\"ubuntu-latest\",\"node\":22},{\"os\":\"ubuntu-latest\",\"node\":24},{\"os\":\"windows-latest\",\"node\":22}${mac}]}" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # capsules check compares against the pull request's base (C6.4)
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run spec:check
      - run: npm test
        if: runner.os != 'Windows'
      # On Windows, print every test's time, to spot a stall seen once during M3.
      - run: npm test -- --reporter=verbose --slowTestThreshold=0
        if: runner.os == 'Windows'
      - name: dogfood (guard this repo's own changes with its .capsules/)
        run: node dist/cli.js check --no-run
      - name: demo app tests (must pass unchanged)
        working-directory: examples/billing-demo
        run: npm test
      - name: demo capsules and lockfile are valid and up to date
        working-directory: examples/billing-demo
        # --base HEAD: the demo is test data, so validate it without guarding this PR's history.
        run: node ../../dist/cli.js check --no-run --base HEAD
      - name: hook speed (report only; shared runners vary, so this never fails the build)
        continue-on-error: true
        run: node scripts/bench-hooks.mjs
      - name: npx . --version
        shell: bash
        run: |
          out="$(npx --yes . --version)"
          echo "capsules --version -> $out"
          test "$out" = "$(node -p "require('./package.json').version")"

  # One result for the whole run (D-022). On pull requests, a macOS job that was cancelled
  # before running any step (no runner was free) counts as skipped, not failed. Every other
  # failure, timeout or cancellation fails. macOS still runs, and must pass, on main.
  ci-ok:
    needs: [plan, test]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > jobs.json
          jq -r '.jobs[] | select(.name != "ci-ok") | "\(.name): \(.conclusion // "unfinished") (\(.steps | length) steps)"' jobs.json
          bad=$(jq -r --arg event "$EVENT" '
            [.jobs[]
              | select(.name != "ci-ok")
              | select(.conclusion != "success" and .conclusion != "skipped")
              | select(($event == "pull_request" and (.name | startswith("macos")) and .conclusion == "cancelled" and (.steps | length) == 0) | not)
              | .name] | join(", ")' jobs.json)
          if [ -n "$bad" ]; then
            echo "::error::Failed: $bad"
            exit 1
          fi
          echo "All jobs passed (a macOS job that never got a runner is not counted on pull requests)."
