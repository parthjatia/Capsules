# Publish @pyscoparth/capsules to npm when a version tag (v0.1.0, ...) is pushed (F3).
# Prepared in M6 but not used yet: tags and publishing need Parth's explicit OK, and the
# publish step refuses while package.json is still "private".
#
# npm trusted publishing (https://docs.npmjs.com/trusted-publishers, checked 2026-11-16):
# - needs npm CLI 11.5.1 or later and Node 22.14.0 or later;
# - needs `id-token: write`; no npm token is stored anywhere;
# - provenance is added automatically for a public package from a public repository;
# - on npmjs.com, set the package's Trusted Publisher to GitHub Actions, user parthjatia,
#   repository Capsules, workflow file release.yml;
# - package.json "repository" must match this repository exactly.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never cache in release builds (npm docs)
      - name: the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: the package is no longer private (Parth removes "private" in a reviewed PR)
        run: |
          node -e "if (require('./package.json').private) { console.error('package.json is still private: nothing is published.'); process.exit(1) }"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: npm 11.5.1 or later (trusted publishing)
        run: |
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)" || npm install -g npm@11
      # A pre-release (0.1.0-rc.2) goes to the `next` tag, so `npx @pyscoparth/capsules` keeps
      # installing the last real release (D-042).
      - name: npm publish
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) npm publish --access public --tag next ;;
            *) npm publish --access public ;;
          esac
