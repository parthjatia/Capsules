format: 0.1
agents: [{{agents}}]
ignore:
  - ".capsules/**"
  - ".claude/**"
  - ".cursor/**"
  - ".github/**"
  - "README.md"
  - "CHANGELOG.md"
  - "AGENTS.md"
  - "CLAUDE.md"
  - "docs/**"
  - "**/package-lock.json"
  - "**/pnpm-lock.yaml"
