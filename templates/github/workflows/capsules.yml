# Added by `capsules init --workflow`. Runs the capsules guard on every pull request and posts
# one summary comment, updated on every push. Remove with `capsules remove`.
name: capsules

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write # to post and update the summary comment

jobs:
  capsules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # capsules compares against the pull request's base
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: parthjatia/Capsules/action@v0.1
